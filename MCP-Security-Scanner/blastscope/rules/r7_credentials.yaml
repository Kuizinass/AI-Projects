# R7 — Credential exposure
rules:
  - id: BS-R7-001
    risk_class: R7
    severity: high
    title: Known credential format hardcoded in config
    applies_to: env_value
    detector: regex
    redact: true
    pattern: '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
    explanation: >
      A recognisable live credential is stored in plaintext in the client config.
      Config files are synced, backed up, and world-readable more often than
      anyone intends — and every process on the machine can read them.
    remediation: 'Rotate this credential now, then reference it via OS keychain or environment: "${VAR_NAME}".'
    mappings: {owasp_llm10: "LLM02 Sensitive Information Disclosure", mitre_atlas: "AML.T0052", nist_ai_rmf: "GOVERN"}

  - id: BS-R7-002
    risk_class: R7
    severity: medium
    title: Probable secret hardcoded in config (entropy)
    applies_to: env_value
    detector: builtin
    builtin: high_entropy_secret
    explanation: >
      A long high-entropy value in an env block is very likely a credential even
      if it matches no known vendor format.
    remediation: Move the value to the OS keychain or an environment reference and rotate it.
    mappings: {owasp_llm10: "LLM02 Sensitive Information Disclosure", mitre_atlas: "AML.T0052", nist_ai_rmf: "GOVERN"}

  - id: BS-R7-003
    risk_class: R7
    severity: high
    title: Credential passed as command-line argument
    applies_to: arg
    detector: regex
    redact: true
    pattern: '^--?(api[-_]?key|token|password|secret|auth)[=:].{8,}'
    explanation: >
      Command-line arguments are visible to every user on the machine via the
      process list — worse than a config file.
    remediation: Pass credentials via environment references or the OS keychain, never argv.
    mappings: {owasp_llm10: "LLM02 Sensitive Information Disclosure", mitre_atlas: "AML.T0052", nist_ai_rmf: "GOVERN"}

  - id: BS-R7-004
    risk_class: R7
    severity: high
    title: Credential embedded in server URL
    applies_to: url
    detector: regex
    redact: true
    pattern: '(api[-_]?key|token|access[-_]?token|secret)=[A-Za-z0-9_.~-]{12,}|https?://[^/\s:]+:[^@\s]{6,}@'
    explanation: >
      Secrets in URLs leak through logs, proxies, browser history and referrer
      headers.
    remediation: Move authentication to a header or OAuth flow; rotate the exposed value.
    mappings: {owasp_llm10: "LLM02 Sensitive Information Disclosure", mitre_atlas: "AML.T0052", nist_ai_rmf: "GOVERN"}
