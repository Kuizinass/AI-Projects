[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blastscope"
version = "1.0.0"
description = "See your agent's blast radius before an attacker does — security posture assessment for MCP and agentic AI installations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Marius Poskus" }]
keywords = ["mcp", "security", "ai-agents", "scanner", "prompt-injection", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = ["click>=8.1", "rich>=13.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
blastscope = "blastscope.cli:main"

[project.urls]
Homepage = "https://github.com/Kuizinass/AI-Projects/tree/main/mcp-security-scanner"

[tool.hatch.build.targets.wheel]
packages = ["blastscope"]
