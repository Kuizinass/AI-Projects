"""Machine-readable JSON output for CI and pipelines."""
from __future__ import annotations

import json
from datetime import datetime, timezone

from blastscope import __version__
from blastscope.models import Finding, Installation
from blastscope.scoring import Assessment


def render(inst: Installation, findings: list[Finding], assessment: Assessment) -> str:
    doc = {
        "tool": "blastscope",
        "version": __version__,
        "generated_at": datetime.now(timezone.utc).isoformat(),
        "installation": {
            "clients": inst.clients_found,
            "servers": [
                {"name": s.name, "transport": s.transport, "client": s.source_client,
                 "config": s.source_path, "tools_declared": len(s.tools)}
                for s in inst.servers
            ],
        },
        "assessment": {
            "score": assessment.score,
            "grade": assessment.grade,
            "verdict": assessment.verdict,
            "counts": assessment.counts,
        },
        "findings": [f.to_dict() for f in findings],
    }
    return json.dumps(doc, indent=2)
